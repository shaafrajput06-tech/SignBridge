name: signbridge_mobile
description: SignBridge local-first English and Urdu sign vocabulary companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  flutter_tts: ^4.2.5
  http: ^1.6.0
  image: ^4.5.4
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocabulary.json
