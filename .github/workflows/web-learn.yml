# The web-learning pipeline (master-v3 Stage 1, tools/web_learn). Runs on GitHub's computers because it
# needs the internet; it never runs inside the app and never publishes the website.
#
#   1. search  - the SLT PSL dictionary's clip list, Wikimedia Commons and the Internet Archive (and
#                YouTube, metadata only, if the YOUTUBE_API_KEY secret is set). Writes candidates and
#                draft licence-ledger entries. Nothing is downloaded in this step.
#   2. fetch   - downloads ONLY clips whose entry is already in the committed data/LICENSES.yaml
#                (the dictionary is covered from the start; web finds after their drafted entries are
#                committed), extracts landmarks, filters, cross-checks, writes the report.
#   3. check   - every clip in the manifest is allowed by the ledger.
#
# Results: the run's summary page, and Artifacts "web-learned-vN" (landmarks + manifest, which are data
# and never committed) and "web-learn-metadata-vN" (candidates, drafted ledger entries, report).
name: Web learning (Stage 1)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Output version number (data/web_learned/vN)"
        default: "1"
      web_words:
        description: "Search only the first N vocabulary words on the web (empty = all 64)"
        default: ""
      limit:
        description: "Download at most N clips (empty = all allowed)"
        default: ""
  push:
    branches: ["v3/**"]
    paths: ["tools/web_learn/**", ".github/workflows/web-learn.yml"]

permissions:
  contents: read

concurrency:
  group: web-learn-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  web-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      VERSION: ${{ inputs.version || '1' }}
      GITHUB_TOKEN: ${{ github.token }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for MediaPipe
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends libegl1 libgles2

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Download the pinned model files (size and SHA-256 checked)
        run: python tools/fetch_assets.py

      - name: 1. Search (metadata only, no downloads)
        run: |
          args="--version $VERSION"
          if [ -n "${{ inputs.web_words }}" ]; then args="$args --web-words ${{ inputs.web_words }}"; fi
          python -m tools.web_learn search $args

      - name: Show the candidates and the drafted ledger entries
        run: |
          python - <<'EOF'
          import json, os, collections
          v = os.environ["VERSION"]
          data = json.load(open(f"data/web_learn/candidates_v{v}.json", encoding="utf-8"))
          c = data["candidates"]
          print("candidates:", len(c), dict(collections.Counter(x["source"] for x in c)))
          print("download allowed:", sum(x["download_allowed"] for x in c))
          print("search problems:", len(data["problems"]), data["problems"][:5])
          print("===WEB-CANDIDATES-BEGIN===")
          print(json.dumps([x for x in c if x["source"] != "slt"], ensure_ascii=False))
          print("===WEB-CANDIDATES-END===")
          EOF
          echo "===LEDGER-DRAFTS-BEGIN==="
          cat "data/web_learn/ledger_drafts_v${VERSION}.yaml"
          echo "===LEDGER-DRAFTS-END==="

      - name: 2. Fetch allowed clips, extract landmarks, filter, cross-check, report
        run: |
          args="--version $VERSION"
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          python -m tools.web_learn fetch $args

      - name: 3. Every manifest entry is allowed by the ledger
        run: python -m tools.web_learn check

      - name: Report
        if: always()
        run: |
          if [ -f "reports/web_learn_v${VERSION}.md" ]; then
            cat "reports/web_learn_v${VERSION}.md" >> "$GITHUB_STEP_SUMMARY"
            echo "===REPORT-BEGIN==="; cat "reports/web_learn_v${VERSION}.md"; echo "===REPORT-END==="
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-learn-metadata-v${{ env.VERSION }}
          path: |
            data/web_learn/
            reports/web_learn_v*.md
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-learned-v${{ env.VERSION }}
          path: data/web_learned/
          if-no-files-found: warn
          retention-days: 90
