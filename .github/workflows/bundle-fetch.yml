# Copies a finished PSL training run's bundle (artifact psl-bundle) onto a review branch that holds only the
# bundle files (no workflows), so it can be checked before anything goes to v3/master. Never touches main.
name: PSL bundle to review branch

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "psl-train run id"
        required: true
  push:
    branches: ["v3/**"]
    paths: [".github/workflows/bundle-fetch.yml"]

permissions:
  contents: write
  actions: read

env:
  RUN_ID: ${{ github.event.inputs.run_id || '44884632047' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: psl-bundle
          path: bundle
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Push the bundle files alone to bundles/psl-from-${{ env.RUN_ID }}
        run: |
          set -e
          find bundle -type f | sort
          OUT=$(dirname "$(find bundle -name manifest.json | head -1)")
          SUMMARY=$(find bundle -name signspeak_summary.json | head -1)
          mkdir -p /tmp/pick/models/psl /tmp/pick/tests/golden /tmp/pick/reports
          cp "$OUT/manifest.json" "$OUT/psl_v3.tflite" /tmp/pick/models/psl/
          cp "$OUT/parity_cases.json" /tmp/pick/tests/golden/psl_parity_cases.json
          cp "$OUT/report.md" /tmp/pick/reports/psl_v3_run.md
          cp "$OUT/measurements.json" /tmp/pick/reports/psl_v3_measurements.json
          [ -n "$SUMMARY" ] && cp "$SUMMARY" /tmp/pick/reports/psl_v3_signspeak_summary.json
          git config user.name "signbridge-psl-train"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "bundles/psl-from-$RUN_ID"
          git rm -rf -q --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/pick/. .
          git add models tests reports
          git commit -q -m "PSL bundle from training run $RUN_ID"
          git push -f origin "bundles/psl-from-$RUN_ID"
