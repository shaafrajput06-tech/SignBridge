# Stage 2 data work (tools/psl_data): runs on GitHub's computers because it needs the internet.
# Prints only; it never commits data and never publishes the website.
name: PSL training data (Stage 2)

on:
  workflow_dispatch:
  push:
    branches: ["v3/**"]
    paths: ["tools/psl_data/**", ".github/workflows/psl-data.yml"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy PyYAML jsonschema
      - name: Look inside the licensed PSL datasets
        run: python -m tools.psl_data.discover
