# Puts the tested offline copy (artifact "shared-copy" of the release pull request's checks) on a temporary
# branch holding only that zip, so the owner's browser can attach it to the GitHub Release. Never touches main;
# the branch can be deleted once the release exists.
name: Offline copy for the release

on:
  workflow_dispatch:
  push:
    branches: ["v3/**"]
    paths: [".github/workflows/release-asset.yml"]

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "44891334895"  # preview checks of pull request #2 (the merged release), all passed
  BRANCH: release-assets/v3.0.0

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-copy
          path: zip
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Push the zip alone to ${{ env.BRANCH }}
        run: |
          set -e
          ls -la zip
          cp zip/SignBridge-shared-copy.zip /tmp/SignBridge-shared-copy.zip
          (cd /tmp && sha256sum SignBridge-shared-copy.zip > SignBridge-shared-copy.zip.sha256 && cat SignBridge-shared-copy.zip.sha256)
          git config user.name "signbridge-release"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf -q --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/SignBridge-shared-copy.zip /tmp/SignBridge-shared-copy.zip.sha256 .
          git add SignBridge-shared-copy.zip SignBridge-shared-copy.zip.sha256
          git commit -q -m "Offline copy for SignBridge 3.0 (from checks run $RUN_ID)"
          git push -f origin "$BRANCH"
