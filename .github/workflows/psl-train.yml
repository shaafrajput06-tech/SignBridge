# Stage 2: converts the licensed PSL data, trains and measures the PSL recogniser, and exports the model
# bundle as an artifact. Runs on GitHub's computers (CPU); the owner never trains anything (CLAUDE.md 8.1).
# Data never enters git and this workflow never publishes the website.
name: PSL model (Stage 2)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs per model"
        default: "100"
  push:
    branches: ["v3/**"]
    paths:
      - "tools/psl_train/**"
      - "tools/psl_data/signspeak.py"
      - "ml_engine/psl_hands.py"
      - "shared_data/psl_hands_spec.json"
      - "shared_data/psl_glosses.json"
      - ".github/workflows/psl-train.yml"

permissions:
  contents: write  # only to push the finished bundle to a separate review branch (bundles/psl-run-N)
  actions: read    # to read the Stage 1 web-learned landmarks artifact

env:
  WEB_LEARN_RUN: "44767308852"  # Stage 1 run whose SLT dictionary landmarks test one independent signer

concurrency:
  group: psl-train-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy PyYAML jsonschema "tensorflow-cpu>=2.16,<3" ai-edge-litert
      - name: Export check with an untrained model (fails fast if TFLite cannot build the bundle)
        run: python -m tools.psl_train.smoke
      - name: Keep the converted data between runs
        uses: actions/cache@v4
        with:
          path: data/psl-signspeak-words
          key: signspeak-${{ hashFiles('tools/psl_data/signspeak.py') }}
      - name: Convert SignSpeak (licence checked before download)
        run: |
          if [ ! -f data/psl-signspeak-words/signspeak.npz ]; then
            python -m tools.psl_data.signspeak --out data/psl-signspeak-words
          else
            python -c "import json; print(json.dumps({k: v for k, v in json.load(open('data/psl-signspeak-words/signspeak_summary.json')).items() if k != 'per_word'}, indent=2))"
          fi
      - name: Get the Stage 1 SLT dictionary landmarks (independent-signer check)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-learned-v1
          path: data/web_learned  # the artifact holds v1/ (manifest.json + landmark files)
          run-id: ${{ env.WEB_LEARN_RUN }}
          github-token: ${{ github.token }}
      - name: Train, measure and export
        run: |
          IND=""; [ -f data/web_learned/v1/manifest.json ] && IND="--independent data/web_learned/v1"
          python -m tools.psl_train --data data/psl-signspeak-words/signspeak.npz --out out/psl --epochs "${{ github.event.inputs.epochs || '100' }}" $IND
      - name: Push the bundle alone to a review branch (no workflows; never v3/master or main)
        run: |
          set -e
          BRANCH="bundles/psl-run-${{ github.run_number }}"
          mkdir -p /tmp/pick/models/psl /tmp/pick/tests/golden /tmp/pick/reports
          cp out/psl/manifest.json out/psl/psl_v3.tflite /tmp/pick/models/psl/
          cp out/psl/parity_cases.json /tmp/pick/tests/golden/psl_parity_cases.json
          cp out/psl/report.md /tmp/pick/reports/psl_v3_run.md
          cp out/psl/measurements.json /tmp/pick/reports/psl_v3_measurements.json
          cp data/psl-signspeak-words/signspeak_summary.json /tmp/pick/reports/psl_v3_signspeak_summary.json
          cp -r out /tmp/out-keep
          git config user.name "signbridge-psl-train"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf -q --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name data -exec rm -rf {} +
          cp -r /tmp/pick/. .
          git add models tests reports
          git commit -q -m "PSL bundle from training run ${{ github.run_id }} (commit ${{ github.sha }})"
          git push origin "$BRANCH"
          cp -r /tmp/out-keep out
      - name: Upload the bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psl-bundle
          path: |
            out/psl/
            data/psl-signspeak-words/signspeak_summary.json
          if-no-files-found: warn
