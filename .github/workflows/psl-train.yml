# Stage 2: converts the licensed PSL data, trains and measures the PSL recogniser, and exports the model
# bundle as an artifact. Runs on GitHub's computers (CPU); the owner never trains anything (CLAUDE.md 8.1).
# Data never enters git and this workflow never publishes the website.
name: PSL model (Stage 2)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs per model"
        default: "100"
  push:
    branches: ["v3/**"]
    paths:
      - "tools/psl_train/**"
      - "tools/psl_data/signspeak.py"
      - "ml_engine/psl_hands.py"
      - "shared_data/psl_hands_spec.json"
      - "shared_data/psl_glosses.json"
      - ".github/workflows/psl-train.yml"

permissions:
  contents: read

concurrency:
  group: psl-train-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy PyYAML jsonschema "tensorflow-cpu>=2.16,<3" ai-edge-litert
      - name: Export check with an untrained model (fails fast if TFLite cannot build the bundle)
        run: python -m tools.psl_train.smoke
      - name: Keep the converted data between runs
        uses: actions/cache@v4
        with:
          path: data/psl-signspeak-words
          key: signspeak-${{ hashFiles('tools/psl_data/signspeak.py') }}
      - name: Convert SignSpeak (licence checked before download)
        run: |
          if [ ! -f data/psl-signspeak-words/signspeak.npz ]; then
            python -m tools.psl_data.signspeak --out data/psl-signspeak-words
          else
            python -c "import json; print(json.dumps({k: v for k, v in json.load(open('data/psl-signspeak-words/signspeak_summary.json')).items() if k != 'per_word'}, indent=2))"
          fi
      - name: Train, measure and export
        run: python -m tools.psl_train --data data/psl-signspeak-words/signspeak.npz --out out/psl --epochs "${{ github.event.inputs.epochs || '100' }}"
      - name: Upload the bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psl-bundle
          path: |
            out/psl/
            data/psl-signspeak-words/signspeak_summary.json
          if-no-files-found: warn
